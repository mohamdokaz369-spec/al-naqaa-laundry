name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm install --prefix /tmp/naqaa-db --no-audit --no-fund @electric-sql/pglite@0.5.10
      - run: node tests/database.cjs
        env:
          PGLITE_MODULE: /tmp/naqaa-db/node_modules/@electric-sql/pglite
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - run: npm run build
        working-directory: mobile
